name: Run Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1

      - name: Renovate
        uses: renovatebot/github-action@v46.3.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
